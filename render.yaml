services:
  - type: web
    name: ai-stock-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: CACHE_TTL_MARKET
        value: "900"
      - key: CACHE_TTL_NEWS
        value: "7200"
      - key: CACHE_TTL_FINANCIAL
        value: "86400"
